name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Os testes usam src/financas.py, src/risco.py e src/estatistica.py e abrem o app Streamlit (AppTest)
      - run: pip install pandas numpy scipy matplotlib seaborn streamlit pytest
      - run: pytest -v
